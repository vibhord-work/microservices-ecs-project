version: 0.2

env:
  shell: bash
  variables:
    AWS_DEFAULT_REGION: us-east-1
    REGISTRY: 460249938865.dkr.ecr.us-east-1.amazonaws.com

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        export IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}-${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - |
        set -euo pipefail

        docker build -t "$REGISTRY/microservices-employee:$IMAGE_TAG" ./employee-service
        docker build -t "$REGISTRY/microservices-department:$IMAGE_TAG" ./department-service

        docker run --rm \
          -e TEST_ENDPOINT=employees \
          -v "$CODEBUILD_SRC_DIR/tests:/tests:ro" \
          --entrypoint python \
          "$REGISTRY/microservices-employee:$IMAGE_TAG" \
          -m unittest discover -s /tests -v

        docker run --rm \
          -e TEST_ENDPOINT=departments \
          -v "$CODEBUILD_SRC_DIR/tests:/tests:ro" \
          --entrypoint python \
          "$REGISTRY/microservices-department:$IMAGE_TAG" \
          -m unittest discover -s /tests -v

        docker push "$REGISTRY/microservices-employee:$IMAGE_TAG"
        docker push "$REGISTRY/microservices-department:$IMAGE_TAG"

        echo "BUILD PASSED: Images pushed with tag $IMAGE_TAG"

